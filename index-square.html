<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>政务数据问答助手 · 折叠屏方形屏</title>
  <link rel="stylesheet" href="styles-square.css" />
</head>
<body>
  <!-- Square foldable device frame (unfolded) -->
  <div class="foldable-frame">
    <div class="foldable-screen">

      <!-- Status bar -->
      <div class="status-bar">
        <div class="status-time">9:41</div>
        <div class="status-right">
          <div class="status-signal"></div>
          <div class="status-wifi"></div>
          <div class="status-battery"></div>
        </div>
      </div>

      <!-- Fold hinge indicator (subtle) -->
      <div class="fold-hinge"></div>

      <!-- Main content -->
      <div class="content">

        <!-- Mascot avatar with glow halo -->
        <div class="avatar-wrap">
          <div class="avatar-halo"></div>
          <div class="avatar">
            <img src="assets/mascot-avatar.png" alt="AI助手公仔" />
          </div>
        </div>

        <!-- Greeting -->
        <h1 class="greeting-title">Hi你好</h1>
        <p class="greeting-sub">我是政务数据问答助手</p>

        <!-- Suggestion bubbles - horizontal cards, 2 columns on wider screens -->
        <div class="suggestion-list">

          <button class="suggestion-card" type="button">
            <div class="suggestion-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="9" y1="13" x2="15" y2="13"/>
                <line x1="9" y1="17" x2="15" y2="17"/>
              </svg>
            </div>
            <div class="suggestion-text">
              <div class="suggestion-title">我想找一些失信人员相关的数据，请为我推荐。</div>
              <div class="suggestion-desc">目录检索</div>
            </div>
          </button>

          <button class="suggestion-card" type="button">
            <div class="suggestion-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <line x1="9" y1="9" x2="15" y2="9"/>
                <line x1="9" y1="15" x2="15" y2="15"/>
              </svg>
            </div>
            <div class="suggestion-text">
              <div class="suggestion-title">关于以旧换新补贴申请"一件事"，有没有共享应用案例可以参考？</div>
              <div class="suggestion-desc">案例推荐</div>
            </div>
          </button>

          <button class="suggestion-card" type="button">
            <div class="suggestion-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
              </svg>
            </div>
            <div class="suggestion-text">
              <div class="suggestion-title">如何查看角色审批进度？</div>
              <div class="suggestion-desc">操作指引</div>
            </div>
          </button>

          <button class="suggestion-card" type="button">
            <div class="suggestion-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="2" y1="12" x2="22" y2="12"/>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
              </svg>
            </div>
            <div class="suggestion-text">
              <div class="suggestion-title">上级部门一定要把收集的下级区域数据回流给下级吗？</div>
              <div class="suggestion-desc">政策咨询</div>
            </div>
          </button>

        </div>
      </div>

      <!-- Bottom input bar -->
      <div class="input-bar">
        <button class="input-plus" type="button" aria-label="添加">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
        <div class="input-placeholder">发消息或按住说话...</div>
        <button class="input-voice" type="button" aria-label="语音输入">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
