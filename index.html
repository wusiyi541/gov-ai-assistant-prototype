<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>政务数据问答助手</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Phone frame for preview; content area is .phone-screen (375 x 812) -->
  <div class="phone-frame">
    <div class="phone-screen">

      <!-- Status bar -->
      <div class="status-bar">
        <div class="status-time">9:41</div>
        <div class="status-right">
          <div class="status-signal"></div>
          <div class="status-wifi"></div>
          <div class="status-battery"></div>
        </div>
      </div>

      <!-- Top right help icon -->
      <button class="help-btn" id="helpBtn" type="button" aria-label="使用说明">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </button>

      <!-- Main content -->
      <div class="content">

        <!-- Mascot avatar with glow halo -->
        <div class="avatar-wrap">
          <div class="avatar-halo"></div>
          <div class="avatar">
            <img src="assets/mascot-avatar.png" alt="AI助手公仔" />
          </div>
        </div>

        <!-- Greeting -->
        <h1 class="greeting-title">Hi你好</h1>
        <p class="greeting-sub">我是政务数据问答助手</p>

        <!-- Suggestion bubbles -->
        <div class="suggestion-list">

          <button class="suggestion-card" type="button">
            <div class="suggestion-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="9" y1="13" x2="15" y2="13"/>
                <line x1="9" y1="17" x2="15" y2="17"/>
              </svg>
            </div>
            <div class="suggestion-text">
              <div class="suggestion-title">我想找一些失信人员相关的数据，请为我推荐。</div>
              <div class="suggestion-desc">目录检索</div>
            </div>
          </button>

          <button class="suggestion-card" type="button">
            <div class="suggestion-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <line x1="9" y1="9" x2="15" y2="9"/>
                <line x1="9" y1="15" x2="15" y2="15"/>
              </svg>
            </div>
            <div class="suggestion-text">
              <div class="suggestion-title">关于以旧换新补贴申请"一件事"，有没有共享应用案例可以参考？</div>
              <div class="suggestion-desc">案例推荐</div>
            </div>
          </button>

          <button class="suggestion-card" type="button">
            <div class="suggestion-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
              </svg>
            </div>
            <div class="suggestion-text">
              <div class="suggestion-title">如何查看角色审批进度？</div>
              <div class="suggestion-desc">操作指引</div>
            </div>
          </button>

          <button class="suggestion-card" type="button">
            <div class="suggestion-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="2" y1="12" x2="22" y2="12"/>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
              </svg>
            </div>
            <div class="suggestion-text">
              <div class="suggestion-title">上级部门一定要把收集的下级区域数据回流给下级吗？</div>
              <div class="suggestion-desc">政策咨询</div>
            </div>
          </button>

        </div>
      </div>

      <!-- Bottom input bar -->
      <div class="input-bar">
        <button class="input-plus" type="button" aria-label="添加">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
        <div class="input-placeholder">发消息或按住说话...</div>
        <button class="input-voice" type="button" aria-label="语音输入">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
      </div>

      <!-- Home indicator -->
      <div class="home-indicator"></div>

      <!-- Help Modal -->
      <div class="modal-overlay" id="helpModal">
        <div class="modal-sheet">
          <div class="modal-handle"></div>
          <div class="modal-header">
            <h2 class="modal-title">政务数据问答助手使用说明</h2>
            <button class="modal-close" id="closeModal" type="button" aria-label="关闭">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          </div>
          <div class="modal-body">
            <ol class="help-list">
              <li>
                <span class="help-num">1</span>
                <span class="help-text">目前AI助手仅开放<strong>目录检索</strong>、<strong>案例查询</strong>、<strong>操作指引</strong>、<strong>政策解读</strong>四项功能，更多功能持续开发中。</span>
              </li>
              <li>
                <span class="help-num">2</span>
                <span class="help-text"><strong>目录检索：</strong>知识库覆盖申请量＞0的省级目录。</span>
              </li>
              <li>
                <span class="help-num">3</span>
                <span class="help-text"><strong>案例查询：</strong>知识库内容来源于平台运营收集的各渠道数据共享案例。如需提交、更新案例资料，请联系平台客服。</span>
              </li>
              <li>
                <span class="help-num">4</span>
                <span class="help-text"><strong>操作指引：</strong>知识库提供省数据共享"政务数据共享"平台相关操作指南。</span>
              </li>
              <li>
                <span class="help-num">5</span>
                <span class="help-text"><strong>政策解读：</strong>知识库依据《政务数据共享条例》进行解读。</span>
              </li>
            </ol>
            <div class="help-footer">
              <p>使用过程如有疑问、建议，欢迎联系平台客服反馈。</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
